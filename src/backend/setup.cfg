# Docs https://packaging.python.org/en/latest/tutorials/packaging-projects/
[metadata]
name = webdemo-backendservice
version = file: VERSION
description = Python module to demonstrate web service deployment
long_description = file: README.md
license = MIT
url = https://github.com/testruction/fastapi-sqlalchemy-cockroachdb
author = Florian JUDITH
author_email = florian.judith.b@gmail.com
keywords =
    service
    api
    aws
    cockroachdb
    postgres

classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent


[options]
python_requires = >=3.10

install_requires =
    PyJWT==2.10.1
    fastapi==0.115.12
    hypercorn==0.17.3
    uvicorn==0.34.3
    jinja2==3.1.6
    boto3==1.38.20
    psycopg2-binary==2.9.10
    SQLAlchemy==2.0.49
    sqlalchemy-cockroachdb==2.0.4
    prometheus-fastapi-instrumentator
    opentelemetry-exporter-otlp
    opentelemetry-instrumentation-dbapi
    opentelemetry-instrumentation-fastapi
    opentelemetry-instrumentation-logging
    opentelemetry-instrumentation-psycopg2
    opentelemetry-instrumentation-sqlite3

[options.extras_require]
dev =
    build
    cryptography

tests =
    pytest
    pytest-dotenv
    httpx

[options.package_data]
* = VERSION, README.md


[options.entry_points]
console_scripts =
    backendservice = backendservice:app


[flake8]
ignore = E501
