# Docs https://packaging.python.org/en/latest/tutorials/packaging-projects/
[metadata]
name = webdemo-frontendservice
version = file: VERSION
description = Python module to demonstrate web service deployment
long_description = file: README.md
license = MIT
url = https://github.com/testruction/fastapi-sqlalchemy-cockroachdb
author = Florian JUDITH
author_email = florian.judith.b@gmail.com
keywords =
    webservice
    dashboard
    aws
    postgres

classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent


[options]
python_requires = >=3.10

install_requires =
    PyJWT==2.10.1
    fastapi==0.115.12
    hypercorn==0.17.3
    uvicorn==0.34.3
    jinja2==3.1.6
    boto3==1.38.20
    dash==2.18.2
    pandas==2.2.3
    httpx==0.28.1
    prometheus-fastapi-instrumentator
    opentelemetry-exporter-otlp
    opentelemetry-instrumentation-httpx
    opentelemetry-instrumentation-fastapi
    opentelemetry-instrumentation-logging

[options.extras_require]
dev =
    build
    cryptography

tests =
    pytest
    pytest-dotenv

[options.package_data]
* = *.json, *.yaml, *.csv, *.sql, VERSION, *.jinja, README.md, *.css, *.svg, *.ico


[options.entry_points]
console_scripts =
    frontendservice = frontendservice:app


[tool.pytest]
minversion = 6.0
addopts = -ra -q
log_cli = true
log_cli_level = INFO
# asyncio_mode = "auto"
env_files =
    .env


[flake8]
ignore = E501